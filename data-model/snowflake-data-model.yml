reference_field_frequency:
  owner: 53
  database_name: 45
  schema_name: 43
  warehouse: 16
  request_id: 12
  grantee_name: 8
  catalog_table_name: 6
  query_warehouse: 5
  note: >-
    Counted across the 303 named component schemas. The (database_name, schema_name, owner)
    triple is the backbone of the model — if an agent can resolve those three it can place
    almost any object in the graph.

caveats:
  - >-
    303 schemas is inflated. The harvest carried two source documents for many resources, so
    roughly half the names are `_2` duplicates (Database / Database_2, Table / Table_2). The
    real distinct entity count is closer to 150.
  - >-
    The Grant model is the hardest part of the graph and is also the most deprecated: seven of
    the eighteen deprecated operations are grant/revoke. Prefer the database-role scoped grant
    operations over /api/v2/grants/... . See lifecycle/snowflake-lifecycle.yml.
  - >-
    No entity carries a stable surrogate ID, so renaming an object breaks every stored reference
    to it. An agent holding "the table called ORDERS" holds a path, not a handle.

render: subway/
render_note: The subway/ directory in this repo holds the visual rendering of this graph.
