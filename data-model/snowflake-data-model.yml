method: derived
source: >-
  Derived from the 47 OpenAPI documents in openapi/ — path hierarchy, component schemas (303
  named schemas, of which roughly half are `_2` duplicates left by the multi-source harvest) and
  the id-reference fields those schemas carry. Object semantics cross-checked against
  https://docs.snowflake.com/en/developer-guide/snowflake-rest-api/snowflake-rest-api .
provider: Snowflake
providerId: snowflake
description: >-
  The Snowflake REST API models the SQL object hierarchy directly: the URL path IS the
  containment relationship. account > database > schema > object. Almost every entity in the
  corpus is reached at
  /api/v2/databases/{database}/schemas/{schema}/<plural>/{name} , and the small set that is not
  lives at the account level. There are no surrogate object IDs — the primary key of every
  object is its case-sensitive, optionally quoted `name` within its container.

identifier_scheme:
  type: name-path, not surrogate ID
  schema: openapi/common.yaml#/components/schemas/Identifier
  pattern: '^"([^"]|"")+"|[a-zA-Z_][a-zA-Z0-9_$]*$'
  description: >-
    A Snowflake object identifier. If it contains spaces or special characters the whole string
    must be double-quoted, and quoted identifiers are case-sensitive. This is the single most
    common source of 404s for an agent: an unquoted identifier is folded to uppercase.
  note: >-
    There is no `id` field and no prefix convention (no `db_`, `tbl_`). Object identity is
    (database, schema, name) — or (name) at the account level. Two objects with the same name in
    different schemas are different objects, and nothing in a response body disambiguates them
    except the path you asked for.

containers:
  - entity: Account
    path: /api/v2/accounts/{name}
    level: organization
    contains: [Database, Warehouse, Role, User, ComputePool, ExternalVolume, ApiIntegration, CatalogIntegration, NotificationIntegration, NetworkPolicy, ManagedAccount]
  - entity: Database
    path: /api/v2/databases/{name}
    level: account
    contains: [Schema, DatabaseRole]
  - entity: Schema
    path: /api/v2/databases/{database}/schemas/{name}
    level: database
    contains: [Table, IcebergTable, DynamicTable, EventTable, View, Stage, Task, Pipe, Stream, Sequence, Secret, Tag, Notebook, Streamlit, Function, Procedure, UserDefinedFunction, Alert, Service, ImageRepository, CortexSearchService, NetworkRule, PasswordPolicy, ArtifactRepository]

