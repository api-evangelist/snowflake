deprecation_policy:
  published: true
  name: Behavior change policy / Behavior Change Release (BCR) bundles
  url: https://docs.snowflake.com/en/release-notes/behavior-change-policy
  announcements: https://docs.snowflake.com/en/release-notes/behavior-changes
  mechanism: >-
    Breaking and behavior-altering changes are not shipped in ordinary releases. They are
    collected into dated bundles that customers can enable and disable per account while the
    bundle is in flight.
  stages:
    - stage: Testing period
      status: Disabled by default
      length: about 4 weeks
      customer_control: Customers opt IN with SYSTEM$ENABLE_BEHAVIOR_CHANGE_BUNDLE to test early.
    - stage: Opt-out period
      status: Enabled by default
      length: about 4 weeks
      customer_control: Customers can still opt OUT with SYSTEM$DISABLE_BEHAVIOR_CHANGE_BUNDLE.
    - stage: Generally enabled
      status: Enabled, not disableable
      customer_control: None. The change is in effect for every account on every deployment.
  minimum_notice: >-
    At least eight weeks from a bundle's first appearance to general enablement, per the
    published policy.
  inspection: SYSTEM$BEHAVIOR_CHANGE_BUNDLE_STATUS
  cadence: New bundles are released on roughly a monthly basis.
  bundles_2026:
