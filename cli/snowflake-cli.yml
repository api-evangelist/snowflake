command_groups_source: >-
  Group list derived from the command-reference pages enumerated in
  https://docs.snowflake.com/en/developer-guide/snowflake-cli/llms.txt . Each `reference` value
  is the real page slug under
  https://docs.snowflake.com/en/developer-guide/snowflake-cli/command-reference/ , so every row
  is verifiable. Group count: 19.

key_flows:
  - name: Run SQL non-interactively
    command: snow sql -q "SELECT CURRENT_VERSION()"
    note: The closest CLI equivalent of submitStatement in the SQL API.
  - name: Deploy a Streamlit app
    command: snow streamlit deploy
  - name: Deploy a Native App
    command: snow app run
  - name: Manage connections
    command: snow connection add / snow connection test

relationship_to_api:
  note: >-
    The CLI authenticates the same four ways the REST API does (key-pair, Snowflake OAuth,
    External OAuth, programmatic access token) and targets the same per-account host. It is a
    front end over the same control plane the openapi/ corpus describes, not a separate product.
  see: authentication/snowflake-authentication.yml

packaging: packages/snowflake-packages.yml
