description: >-
  Snowflake CLI is Snowflake's open-source command-line tool for developer-centric workloads in
  addition to SQL operations. It is the successor to SnowSQL and is the only first-party surface
  that covers Native Apps, Snowpark, Snowpark Container Services, notebooks, Streamlit apps and
  dbt from one binary.

