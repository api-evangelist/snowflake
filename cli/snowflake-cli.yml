install:
  - method: pip
    command: pip install snowflake-cli
    registry: pypi
    package: snowflake-cli
    url: https://pypi.org/project/snowflake-cli/
  - method: pipx
    command: pipx install snowflake-cli
    note: >-
      Recommended where the CLI should be isolated from the project's Python environment.
  - method: installer
    url: https://docs.snowflake.com/en/developer-guide/snowflake-cli/installation/installation
    note: >-
      Snowflake also documents platform installers and Homebrew. The exact per-platform commands
      live on the installation page and are not restated here rather than guessed.

