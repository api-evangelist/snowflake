components:
  schemas:
    PointOfTime:
      type: object
      properties:
        point_of_time_type:
          type: string
          description: 'Type of the point of time. Possible values include: timestamp, offset, statement'
          example: timestamp
        reference:
          type: string
          enum:
          - at
          - before
          x-enum-varnames:
          - AT
          - BEFORE
          description: Relation to the point of time.  Currently, the API supports `at` and `before`
          example: at
      required:
      - point_of_time_type
      - reference
      discriminator:
        propertyName: point_of_time_type
        mapping:
          timestamp: PointOfTimeTimestamp
          offset: PointOfTimeOffset
          statement: PointOfTimeStatement
    Schedule:
      type: object
      properties:
        schedule_type:
          type: string
          description: Type of the schedule, can be either CRON_TYPE or MINUTES_TYPE
      required:
      - schedule_type
      discriminator:
        propertyName: schedule_type
        mapping:
          CRON_TYPE: CronSchedule
          SCHEDULE_TYPE: MinutesSchedule
    AlertClone:
      type: object
      properties:
        name:
          type: string
          description: Name of the alert
        point_of_time:
          $ref: '#/components/schemas/PointOfTime'
          description: 'Type of the point of time. Possible values include:

            - `timestamp`: Exact time using the standard timezone format. Example: `TO_TIMESTAMP(1749423600)`. - `offset`: Interval relative to ''now.'' in the form -N where N can be an integer or arithmetic expression. Example: `-120` - `statement`: ID of a query statement to use as the reference point for <a href=https://docs.snowflake.com/en/sql-reference/sql/create-clone#time-travel-parameters>Time Travel</a>.

            For more information, see https://docs.snowflake.com/en/sql-reference/data-types-datetime.'
      required:
      - name
    Alert:
      type: object
      description: A Snowflake alert
      properties:
        name:
          type: string
          description: Name of the alert
        comment:
          type: string
          description: user comment associated to an object in the dictionary
        schedule:
          $ref: '#/components/schemas/Schedule'
          description: The schedule the alert runs under
        warehouse:
          type: string
          description: The warehouse the alert runs in
        condition:
          type: string
          description: The SQL statement that must be evaluated to determine whether to trigger the alert
        action:
          type: string
          description: The SQL statement to execute when the alert is triggered
        created_on:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the alert was created.
        database_name:
          type: string
          readOnly: true
          description: Database in which the alert is stored
        schema_name:
          type: string
          readOnly: true
          description: Schema in which the alert is stored
        owner:
          type: string
          readOnly: true
          description: Role that owns the alert
        owner_role_type:
          type: string
          readOnly: true
          description: The type of role that owns the alert
        state:
          type: string
          readOnly: true
          description: The current state of the alert
      required:
      - name
      - schedule
      - condition
      - action
  securitySchemes:
    KeyPair:
      $ref: common.yaml#/components/securitySchemes/KeyPair
    ExternalOAuth:
      $ref: common.yaml#/components/securitySchemes/ExternalOAuth
    SnowflakeOAuth:
      $ref: common.yaml#/components/securitySchemes/SnowflakeOAuth
    ProgrammaticAccessToken:
      $ref: common.yaml#/components/securitySchemes/ProgrammaticAccessToken
