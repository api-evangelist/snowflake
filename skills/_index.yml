shared_rules:
  authentication: >-
    Every call needs an Authorization header AND the X-Snowflake-Authorization-Token-Type header
    naming the credential kind (KEYPAIR_JWT, OAUTH, or PROGRAMMATIC_ACCESS_TOKEN). Omitting the
    type header is the most common 401.
  identifiers: >-
    Object names fold to uppercase unless double-quoted. A quoted identifier is case-sensitive.
    Get this wrong and you get 404, not a helpful error.
  idempotency: >-
    Use createMode=ifNotExists on creates and ifExists=true on deletes. There is no
    Idempotency-Key; a retry is re-evaluated against current state, not replayed.
  errors: >-
    Errors are application/json { message, code, error_code (deprecated), request_id } — NOT
    RFC 9457 problem+json. Branch on `code`, log `request_id`.
  rate_limits: >-
    429 carries no Retry-After and no RateLimit headers. Back off with jitter starting around 2
    seconds and doubling.
  reversibility: >-
    DROP is reversible only for the object types with an :undrop operation, and only inside the
    account's Time Travel window, which DEFAULTS TO ONE DAY. Never assume 90 days.
  no_dry_run: >-
    There is no dry-run or validate-only mode anywhere in this API. Every call you make is real.

