aid: snowflake
name: Snowflake
description: Snowflake is a cloud-based data platform delivering data warehousing, data lakes, data engineering, data science
  and data application development as a single managed service across AWS, Azure and Google Cloud. Its developer surface is
  a 47-document OpenAPI corpus over /api/v2 covering databases, schemas, tables, Iceberg and dynamic tables, warehouses, tasks,
  pipes, streams, roles and grants, plus a SQL API for arbitrary statements and a Cortex family for AI inference, semantic
  analytics and retrieval. Snowflake also serves a SCIM 2.0 identity endpoint, an Apache Iceberg REST Catalog, and an account-hosted
  Model Context Protocol server that exposes Cortex tools to agents under Snowflake RBAC.
